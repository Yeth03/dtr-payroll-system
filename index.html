<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RGSERVE DTR & Payroll System</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Consolas', 'Fira Code', 'Monaco', 'Segoe UI', monospace;
      box-shadow: none !important;
      text-shadow: none !important;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), 
                  url('kali.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body {
      padding: 12px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      margin-bottom: 12px;
      background: rgba(13, 17, 23, 0.55);
      border-radius: 10px;
      border: 1px solid rgba(0, 242, 254, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    h1 {
      color: #00f2fe;
      font-size: 16px;
      letter-spacing: 0.5px;
    }

    .clock-display {
      font-size: 12px;
      font-weight: bold;
      color: #00ff87;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(0, 255, 135, 0.4);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .card {
      background: rgba(13, 17, 23, 0.5);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .card h3 {
      font-size: 9px;
      color: #b0bac5;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .card .value {
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
    }

    .main-content {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 12px;
    }

    @media (max-width: 820px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    .form-section, .table-section {
      background: rgba(13, 17, 23, 0.55);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(0, 242, 254, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .form-section h2, .table-section h2 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #00f2fe;
      border-left: 3px solid #00f2fe;
      padding-left: 8px;
    }

    .label-text {
      display: block;
      font-size: 10px;
      color: #d0d7de;
      margin-top: 10px;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* GLASS UI STYLING PARA SA INPUTS & DROPDOWNS */
    input, select {
      width: 100%;
      padding: 9px 10px;
      background: rgba(10, 15, 25, 0.75) !important;
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: #00f2fe !important;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      backdrop-filter: blur(8px);
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      transition: all 0.2s ease-in-out;
    }

    input:focus, select:focus {
      border-color: #00ff87;
      background: rgba(10, 15, 25, 0.9) !important;
    }

    /* BAGONG GLASS DARK STYLE PARA SA OPTIONS LIST */
    select option {
      background-color: #0d1117 !important;
      color: #00f2fe !important;
      padding: 10px;
      font-size: 12px;
    }

    .shift-presets {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .preset-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 2px;
      border-radius: 5px;
      font-size: 9px;
      cursor: pointer;
    }

    .preset-btn:active {
      background: rgba(0, 242, 254, 0.3);
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
      font-size: 12px;
    }

    .btn-save {
      background: #00f2fe;
      color: #0d1117;
    }

    .btn-save:active {
      transform: scale(0.98);
    }

    .btn-export {
      background: #00ff87;
      color: #0d1117;
      width: auto;
      padding: 6px 12px;
      font-size: 10px;
      font-weight: bold;
      border-radius: 5px;
    }

    .filter-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .filter-item {
      flex: 1;
      min-width: 120px;
    }

    .filter-item label {
      font-size: 9px;
      color: #b0bac5;
      display: block;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .table-header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* SCROLLABLE RESPONSIVE TABLE */
    .table-wrapper {
      width: 100%;
      max-height: 400px;
      overflow-x: auto;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
      white-space: nowrap;
      min-width: 580px;
    }

    th, td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    th {
      position: sticky;
      top: 0;
      background: rgba(13, 17, 23, 0.95);
      color: #00f2fe;
      font-weight: 600;
      font-size: 9px;
      text-transform: uppercase;
      z-index: 2;
    }

    tr:hover {
      background: rgba(0, 242, 254, 0.05);
    }

    td:last-child {
      color: #00ff87;
      font-weight: bold;
    }

    .badge-shift {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 8px;
      font-weight: bold;
    }
    .badge-am { background: rgba(0, 242, 254, 0.2); color: #00f2fe; }
    .badge-pm { background: rgba(255, 95, 86, 0.2); color: #ff5f56; }

    .badge-day {
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 8px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .day-reg { background: rgba(255, 255, 255, 0.1); color: #ccc; }
    .day-rest { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
    .day-spl { background: rgba(156, 39, 176, 0.2); color: #e040fb; }
    .day-reghol { background: rgba(244, 67, 54, 0.2); color: #ff5252; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>RGSERVE DTR System</h1>
        <small style="color: #b0bac5; font-size: 9px;">Daily Time Record & Automated Payroll</small>
      </div>
      <div class="clock-display" id="liveClock">00:00:00 AM</div>
    </header>

    <!-- DASHBOARD SUMMARY -->
    <div class="dashboard-grid">
      <div class="card">
        <h3>Total Logs Today</h3>
        <div class="value" id="totalLogs">0</div>
      </div>
      <div class="card">
        <h3>Time In Today</h3>
        <div class="value" id="timeInCount" style="color: #00ff87;">0</div>
      </div>
      <div class="card">
        <h3>Time Out Today</h3>
        <div class="value" id="timeOutCount" style="color: #ff5f56;">0</div>
      </div>
      <div class="card" style="grid-column: span 2;">
        <h3>Payroll Overview (Cut-off)</h3>
        <div class="value" id="payrollOverview" style="font-size: 11px; color: #00f2fe; margin-top: 3px;">
          Est. Work: 0 hrs | Pay: ₱0.00
        </div>
      </div>
    </div>

    <!-- MAIN FORM & TABLE -->
    <div class="main-content">
      
      <!-- FORM SECTION -->
      <div class="form-section">
        <h2>Log Entry</h2>
        <form id="dtrForm">
          <label class="label-text">Employee Name</label>
          <input type="text" id="employeeName" placeholder="Enter Full Name" required>

          <label class="label-text">Work Shift</label>
          <select id="workShift" required>
            <option value="AM">AM Shift (Day)</option>
            <option value="PM">PM Shift (Night)</option>
          </select>

          <label class="label-text">Day Type / Premium</label>
          <select id="dayType" required>
            <option value="REGULAR">Regular Work Day (100%)</option>
            <option value="REST_DAY">Rest Day Duty / Cancel Restday (130%)</option>
            <option value="SPECIAL_HOLIDAY">Special Non-Working Holiday (130%)</option>
            <option value="REGULAR_HOLIDAY">Regular Holiday (200%)</option>
            <option value="REST_SPECIAL">Special Holiday on Rest Day (150%)</option>
            <option value="REST_REGULAR">Regular Holiday on Rest Day (260%)</option>
          </select>

          <label class="label-text">Log Type</label>
          <select id="logType" required>
            <option value="IN">TIME IN</option>
            <option value="OUT">TIME OUT</option>
          </select>

          <label class="label-text">Date & Time</label>
          <input type="datetime-local" id="logTimestamp" required>

          <div class="shift-presets">
            <button type="button" class="preset-btn" onclick="setPresetTime('now')">Current Time</button>
            <button type="button" class="preset-btn" onclick="setPresetTime('am')">06:00 AM</button>
            <button type="button" class="preset-btn" onclick="setPresetTime('pm')">06:00 PM</button>
          </div>

          <button type="submit" class="btn btn-save">Save Log</button>
        </form>
      </div>

      <!-- TABLE SECTION -->
      <div class="table-section">
        <div class="table-header-actions">
          <h2>View Logs & Payroll</h2>
          <button class="btn btn-export" onclick="exportDTR()">Export CSV</button>
        </div>

        <div class="filter-container">
          <div class="filter-item">
            <label>Month & Year</label>
            <input type="month" id="filterMonth" onchange="renderTable()">
          </div>
          <div class="filter-item">
            <label>Cut-off Period</label>
            <select id="filterCutoff" onchange="renderTable()">
              <option value="ALL">All Days (Whole Month)</option>
              <option value="1-15">1st Cut-off (1 - 15)</option>
              <option value="16-31">2nd Cut-off (16 - 30/31)</option>
            </select>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Shift</th>
                <th>Type</th>
                <th>Date</th>
                <th>In</th>
                <th>Out</th>
                <th>Work</th>
                <th>Pay</th>
              </tr>
            </thead>
            <tbody id="dtrTableBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
