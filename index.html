<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RGSERVE DTR System</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Consolas', 'Fira Code', 'Monaco', 'Segoe UI', monospace;
      box-shadow: none !important;
      text-shadow: none !important;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)), 
                  url('kali.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body {
      padding: 10px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    /* GLASS CONTAINER STYLE */
    .glass-card {
      background: rgba(10, 15, 25, 0.25);
      border-radius: 10px;
      border: 1px solid rgba(0, 242, 254, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 12px;
      margin-bottom: 12px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      color: #00f2fe;
      font-size: 16px;
      letter-spacing: 0.5px;
    }

    .clock-display {
      font-size: 12px;
      font-weight: bold;
      color: #00ff87;
      background: rgba(0, 0, 0, 0.3);
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid rgba(0, 255, 135, 0.4);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .card {
      background: rgba(10, 15, 25, 0.25);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .card h3 {
      font-size: 9px;
      color: #b0bac5;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .card .value {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
    }

    .main-content {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 10px;
    }

    @media (max-width: 800px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    .label-text {
      display: block;
      font-size: 10px;
      color: #d0d7de;
      margin-top: 8px;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* GLASS INPUTS & TRANSPARENT DROPDOWNS */
    input, select, .custom-select-trigger {
      width: 100%;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.3) !important;
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: #00f2fe !important;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input:focus, select:focus {
      border-color: #00ff87;
    }

    .shift-presets {
      display: flex;
      gap: 5px;
      margin-top: 8px;
    }

    .preset-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 2px;
      border-radius: 5px;
      font-size: 9px;
      cursor: pointer;
    }

    .preset-btn:active {
      background: rgba(0, 242, 254, 0.3);
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      font-size: 12px;
    }

    .btn-save {
      background: #00f2fe;
      color: #0d1117;
    }

    .btn-export {
      background: #00ff87;
      color: #0d1117;
      width: auto;
      padding: 5px 10px;
      font-size: 10px;
      font-weight: bold;
      border-radius: 5px;
    }

    .filter-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .filter-item {
      flex: 1;
      min-width: 120px;
    }

    .filter-item label {
      font-size: 9px;
      color: #b0bac5;
      display: block;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .table-wrapper {
      width: 100%;
      max-height: 320px;
      overflow-x: auto;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.15);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
      white-space: nowrap;
      min-width: 550px;
    }

    th, td {
      padding: 6px 8px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      position: sticky;
      top: 0;
      background: rgba(10, 15, 25, 0.85);
      color: #00f2fe;
      font-weight: 600;
      font-size: 9px;
      text-transform: uppercase;
      z-index: 2;
      backdrop-filter: blur(8px);
    }

    tr:hover {
      background: rgba(0, 242, 254, 0.1);
    }

    /* CUSTOM GLASS MODAL PARA SA SELECT DROPDOWNS */
    .glass-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .glass-modal-overlay.active {
      display: flex;
    }

    .glass-modal-content {
      background: rgba(10, 18, 30, 0.75);
      border: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      padding: 15px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .glass-modal-title {
      font-size: 12px;
      color: #00f2fe;
      margin-bottom: 10px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 6px;
    }

    .glass-option-item {
      padding: 10px;
      margin-bottom: 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 11px;
      cursor: pointer;
    }

    .glass-option-item:active, .glass-option-item.selected {
      background: rgba(0, 242, 254, 0.2);
      border-color: #00f2fe;
      color: #00f2fe;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="glass-card">
      <div>
        <h1>RGSERVE DTR System</h1>
        <small style="color: #b0bac5; font-size: 9px;">Daily Time Record & Automated Payroll</small>
      </div>
      <div class="clock-display" id="liveClock">00:00:00 AM</div>
    </header>

    <!-- DASHBOARD -->
    <div class="dashboard-grid">
      <div class="card">
        <h3>Total Logs Today</h3>
        <div class="value" id="totalLogs">0</div>
      </div>
      <div class="card">
        <h3>Time In Today</h3>
        <div class="value" id="timeInCount" style="color: #00ff87;">0</div>
      </div>
      <div class="card">
        <h3>Time Out Today</h3>
        <div class="value" id="timeOutCount" style="color: #ff5f56;">0</div>
      </div>
      <div class="card" style="grid-column: span 2;">
        <h3>Payroll Overview (Cut-off)</h3>
        <div class="value" id="payrollOverview" style="font-size: 11px; color: #00f2fe; margin-top: 2px;">
          Est. Work: 0 hrs | Pay: ₱0.00
        </div>
      </div>
    </div>

    <!-- MAIN FORM & TABLE -->
    <div class="main-content">
      
      <!-- FORM SECTION -->
      <div class="glass-card">
        <h2 style="font-size: 13px; color: #00f2fe; margin-bottom: 8px;">Log Entry</h2>
        <form id="dtrForm">
          <label class="label-text">Employee Name</label>
          <input type="text" id="employeeName" placeholder="Enter Full Name" required>

          <label class="label-text">Work Shift</label>
          <select id="workShift" required>
            <option value="AM">AM Shift (Day)</option>
            <option value="PM">PM Shift (Night)</option>
          </select>

          <label class="label-text">Day Type / Premium</label>
          <select id="dayType" required>
            <option value="REGULAR">Regular Work Day (100%)</option>
            <option value="REST_DAY">Rest Day Duty / Cancel Restday (130%)</option>
            <option value="SPECIAL_HOLIDAY">Special Non-Working Holiday (130%)</option>
            <option value="REGULAR_HOLIDAY">Regular Holiday (200%)</option>
            <option value="REST_SPECIAL">Special Holiday on Rest Day (150%)</option>
            <option value="REST_REGULAR">Regular Holiday on Rest Day (260%)</option>
          </select>

          <label class="label-text">Log Type</label>
          <select id="logType" required>
            <option value="IN">TIME IN</option>
            <option value="OUT">TIME OUT</option>
          </select>

          <label class="label-text">Date & Time</label>
          <input type="datetime-local" id="logTimestamp" required>

          <div class="shift-presets">
            <button type="button" class="preset-btn" onclick="setPresetTime('now')">Current Time</button>
            <button type="button" class="preset-btn" onclick="setPresetTime('am')">06:00 AM</button>
            <button type="button" class="preset-btn" onclick="setPresetTime('pm')">06:00 PM</button>
          </div>

          <button type="submit" class="btn btn-save">Save Log</button>
        </form>
      </div>

      <!-- TABLE SECTION -->
      <div class="glass-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <h2 style="font-size: 13px; color: #00f2fe;">View Logs & Payroll</h2>
          <button class="btn btn-export" onclick="exportDTR()">Export CSV</button>
        </div>

        <div class="filter-container">
          <div class="filter-item">
            <label>Month & Year</label>
            <input type="month" id="filterMonth" onchange="renderTable()">
          </div>
          <div class="filter-item">
            <label>Cut-off Period</label>
            <select id="filterCutoff" onchange="renderTable()">
              <option value="ALL">All Days (Whole Month)</option>
              <option value="1-15">1st Cut-off (1 - 15)</option>
              <option value="16-31">2nd Cut-off (16 - 30/31)</option>
            </select>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Shift</th>
                <th>Type</th>
                <th>Date</th>
                <th>In</th>
                <th>Out</th>
                <th>Work</th>
                <th>Pay</th>
              </tr>
            </thead>
            <tbody id="dtrTableBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
