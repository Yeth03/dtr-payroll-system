<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DTR & Payroll Management System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; position: relative; min-height: 100vh; }
    
    .container { max-width: 1050px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
    h1 { font-size: 24px; color: #38bdf8; }
    .subtitle { color: #64748b; font-size: 13px; font-weight: bold; margin-top: 3px; }
    #liveClock { font-size: 18px; font-weight: bold; color: #f59e0b; background: #0f172a; padding: 8px 14px; border-radius: 6px; border: 1px solid #334155; }

    .form-card { background: #0f172a; border-radius: 8px; padding: 20px; border: 1px solid #334155; margin-bottom: 25px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 15px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 11px; font-weight: bold; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select { padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: #38bdf8; }
    
    .btn-submit { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover { background: #0369a1; }

    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
    .stat-item { text-align: center; border-right: 1px solid #334155; }
    .stat-item:last-child { border-right: none; }
    .stat-val { font-size: 18px; font-weight: bold; color: #38bdf8; }
    .stat-lbl { font-size: 11px; color: #64748b; margin-top: 2px; }

    .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 15px; }
    .btn-export { background: #10b981; color: white; border: none; padding: 9px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: auto; }
    .btn-export:hover { background: #059669; }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 13px; }
    th { background: #0f172a; color: #94a3b8; font-weight: 600; }
    tr:hover { background: #283548; }

    .del-btn { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .del-btn:hover { background: #dc2626; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>DTR & Payroll Management</h1>
        <div class="subtitle">Base Daily Rate: ₱755.00 / day</div>
      </div>
      <div id="liveClock">--:--:-- PM</div>
    </header>

    <div class="form-card">
      <form id="dtrForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Employee Name</label>
            <input type="text" id="employeeName" value="Yeth Awayan" required>
          </div>
          <div class="form-group">
            <label>Shift</label>
            <select id="workShift">
              <option value="AM">AM Shift (8:00 AM)</option>
              <option value="PM">PM Shift (8:00 PM)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Day Type</label>
            <select id="dayType">
              <option value="REGULAR">Regular Day (100%)</option>
              <option value="REST_DAY">Rest Day (130%)</option>
              <option value="SPECIAL_HOLIDAY">Special Holiday (130%)</option>
              <option value="REGULAR_HOLIDAY">Regular Holiday (200%)</option>
              <option value="REST_SPECIAL">Rest Day + Special Holiday (150%)</option>
              <option value="REST_REGULAR">Rest Day + Regular Holiday (260%)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Log Type</label>
            <select id="logType">
              <option value="IN">TIME IN</option>
              <option value="OUT">TIME OUT</option>
            </select>
          </div>
          <div class="form-group">
            <label>Date & Time</label>
            <input type="datetime-local" id="logTimestamp" required>
          </div>
        </div>
        <button type="submit" class="btn-submit">SAVE LOG ENTRY</button>
      </form>
    </div>

    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-val" id="totalLogs">0</div>
        <div class="stat-lbl">TOTAL LOGS</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="timeInCount">0</div>
        <div class="stat-lbl">TODAY'S IN</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="timeOutCount">0</div>
        <div class="stat-lbl">TODAY'S OUT</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="payrollOverview">Est. Work: 0.0 hrs | Pay: ₱0.00</div>
        <div class="stat-lbl">PERIOD SUMMARY</div>
      </div>
    </div>

    <div class="filters">
      <input type="month" id="filterMonth" onchange="renderTable()">
      <select id="filterCutoff" onchange="renderTable()">
        <option value="ALL">All Cutoffs</option>
        <option value="1-15">1st Cutoff (1-15)</option>
        <option value="16-31">2nd Cutoff (16-31)</option>
      </select>
      <button type="button" class="btn-export" onclick="exportDTR()">Export CSV</button>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Employee</th>
            <th>Shift</th>
            <th>Day Type</th>
            <th>Date</th>
            <th>Time In</th>
            <th>Time Out</th>
            <th>Work Hours</th>
            <th>Est. Pay</th>
            <th style="text-align: center;">Action</th>
          </tr>
        </thead>
        <tbody id="dtrTableBody">
          <!-- Rendered dynamically by script.js -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
