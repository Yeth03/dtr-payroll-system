<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.75, maximum-scale=1.0, user-scalable=yes">
  <title>RGSERVE DTR & Payroll System</title>
  
  <style>
    html, body {
      width: 100%;
      min-height: 100vh;
      max-width: 100vw;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      touch-action: manipulation;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Consolas', 'Fira Code', 'Monaco', 'Segoe UI', monospace;
      box-shadow: none !important;
      text-shadow: none !important;
      transition: none !important;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.35)), 
                  url('kali.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      padding: 10px; /* Binawasan mula 20px */
    }

    .container {
      max-width: 100%;
      margin: 0 auto;
      width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      margin-bottom: 15px;
      background: rgba(10, 15, 25, 0.20);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    h1 {
      color: #00f2fe;
      font-size: 18px; /* Binawasan mula 24px */
      letter-spacing: 0.5px;
    }

    .clock-display {
      font-size: 14px;
      font-weight: bold;
      color: #00ff87;
      background: rgba(0, 0, 0, 0.35);
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid rgba(0, 255, 135, 0.5);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); /* Mas maliit na cards */
      gap: 10px;
      margin-bottom: 15px;
    }

    .card {
      background: rgba(10, 15, 25, 0.18);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .card h3 {
      font-size: 9px;
      color: #b0bac5;
      text-transform: uppercase;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .card .value {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
    }

    .main-content {
      display: grid;
      grid-template-columns: 280px 1fr; /* Binawasan ang lapad ng form */
      gap: 12px;
    }

    @media (max-width: 850px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    .form-section, .table-section {
      background: rgba(10, 15, 25, 0.20);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .form-section h2, .table-section h2 {
      font-size: 15px;
      margin-bottom: 12px;
      color: #00f2fe;
      border-left: 3px solid #00f2fe;
      padding-left: 8px;
    }

    .label-text {
      display: block;
      font-size: 10px;
      color: #d0d7de;
      margin-top: 10px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      padding: 7px 9px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #00f2fe;
      border-radius: 5px;
      font-size: 12px;
      outline: none;
    }

    select option {
      background: #0d1117;
      color: #00f2fe;
    }

    .shift-presets {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }

    .preset-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 5px 2px;
      border-radius: 4px;
      font-size: 9px;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      font-size: 12px;
    }

    .btn-save {
      background: #00f2fe;
      color: #0d1117;
    }

    .btn-export {
      background: #00ff87;
      color: #0d1117;
      width: auto;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 5px;
    }

    .filter-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .filter-item {
      flex: 1;
      min-width: 120px;
    }

    .filter-item label {
      font-size: 9px;
      color: #b0bac5;
      display: block;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .table-header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Pinakamasinsin na Table Layout para sa CP */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px; /* Mas maliit na font sa table */
      white-space: nowrap; /* Iwas patong-patong ng text */
    }

    th, td {
      padding: 7px 8px; /* Binawasan ang space sa bawat cell */
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    th {
      background: rgba(0, 0, 0, 0.3);
      color: #00f2fe;
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>RGSERVE DTR System</h1>
        <small style="color: #d0d7de; font-size: 10px;">Daily Time Record & Automated Payroll</small>
      </div>
      <div class="clock-display" id="liveClock">00:00:00 AM</div>
    </header>

    <!-- DASHBOARD SUMMARY CARDS -->
    <div class="dashboard-grid">
      <div class="card">
        <h3>Total Logs Today</h3>
        <div class="value" id="totalLogs">0</div>
      </div>
      <div class="card">
        <h3>Time In Today</h3>
        <div class="value" id="timeInCount" style="color: #00ff87;">0</div>
      </div>
      <div class="card">
        <h3>Time Out Today</h3>
        <div class="value" id="timeOutCount" style="color: #ff5f56;">0</div>
      </div>
      <div class="card" style="grid-column: span 2;">
        <h3>Payroll Overview (Cut-off)</h3>
        <div class="value" id="payrollOverview" style="font-size: 12px; color: #00f2fe; margin-top: 3px;">
          Est. Work: 0 hrs | Pay: ₱0.00
        </div>
      </div>
    </div>

    <!-- MAIN INTERFACE -->
    <div class="main-content">
      
      <!-- FORM SECTION -->
      <div class="form-section">
        <h2>Log Entry</h2>
        <form id="dtrForm">
          <label class="label-text">Employee Name</label>
          <input type="text" id="employeeName" placeholder="Enter Full Name" required>

          <label class="label-text">Work Shift</label>
          <select id="workShift" required>
            <option value="AM">AM Shift (Day)</option>
            <option value="PM">PM Shift (Night)</option>
          </select>

          <label class="label-text">Log Type</label>
          <select id="logType" required>
            <option value="IN">TIME IN</option>
            <option value="OUT">TIME OUT</option>
          </select>

          <label class="label-text">Date & Time</label>
          <input type="datetime-local" id="logTimestamp">

          <div class="shift-presets">
            <button type="button" class="preset-btn" onclick="setPresetTime('now')">Current Time</button>
            <button type="button" class="preset-btn" onclick="setPresetTime('am')">06:00 AM</button>
            <button type="button" class="preset-btn" onclick="setPresetTime('pm')">06:00 PM</button>
          </div>

          <button type="submit" class="btn btn-save" id="btnSubmit">Save Log</button>
          <div id="statusAlert" style="display: none; margin-top: 10px; padding: 8px; border-radius: 6px; font-size: 11px; text-align: center;"></div>
        </form>
      </div>

      <!-- TABLE & CUT-OFF FILTER SECTION -->
      <div class="table-section">
        <div class="table-header-actions">
          <h2>View Logs & Payroll</h2>
          <button class="btn btn-export" onclick="exportDTR()">Export CSV</button>
        </div>

        <!-- CUT-OFF & MONTH FILTER CONTROLS -->
        <div class="filter-container">
          <div class="filter-item">
            <label>Month & Year</label>
            <input type="month" id="filterMonth" onchange="renderTable()">
          </div>
          <div class="filter-item">
            <label>Cut-off Period</label>
            <select id="filterCutoff" onchange="renderTable()">
              <option value="ALL">All Days (Whole Month)</option>
              <option value="1-15">1st Cut-off (1 - 15)</option>
              <option value="16-31">2nd Cut-off (16 - 30/31)</option>
            </select>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Shift</th>
                <th>Date</th>
                <th>In</th>
                <th>Out</th>
                <th>Work</th>
                <th>Pay</th>
              </tr>
            </thead>
            <tbody id="dtrTableBody">
              <!-- Logs dynamically rendered here -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
