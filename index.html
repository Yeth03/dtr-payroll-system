<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RGSERVE DTR System</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Consolas', 'Fira Code', 'Monaco', monospace;
      box-shadow: none !important;
      text-shadow: none !important;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)), 
                  url('kali.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body {
      padding: 6px;
      font-size: 11px;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      width: 100%;
    }

    /* LIGHTWEIGHT TRANSPARENT GLASS CARD (NO BLUR = NO LAG) */
    .glass-card {
      background: rgba(8, 14, 24, 0.65);
      border-radius: 6px;
      border: 1px solid rgba(0, 242, 254, 0.25);
      padding: 8px;
      margin-bottom: 8px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
    }

    h1 {
      color: #00f2fe;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .clock-display {
      font-size: 10px;
      font-weight: bold;
      color: #00ff87;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 135, 0.3);
    }

    /* COMPACT DASHBOARD GRID */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .card {
      background: rgba(8, 14, 24, 0.6);
      padding: 6px 8px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .card h3 {
      font-size: 8px;
      color: #b0bac5;
      text-transform: uppercase;
    }

    .card .value {
      font-size: 12px;
      font-weight: bold;
      color: #ffffff;
    }

    /* LAYOUT COMPACT FIT */
    .main-content {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    .label-text {
      display: block;
      font-size: 8px;
      color: #d0d7de;
      margin-top: 5px;
      margin-bottom: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* TRANSPARENT COMPACT INPUTS & SELECTS */
    input, select {
      width: 100%;
      padding: 5px 8px;
      background: rgba(0, 0, 0, 0.5) !important;
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: #00f2fe !important;
      border-radius: 4px;
      font-size: 10px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #00ff87;
    }

    select option {
      background-color: #0a0f1d !important;
      color: #00f2fe !important;
    }

    .shift-presets {
      display: flex;
      gap: 4px;
      margin-top: 6px;
    }

    .preset-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 2px;
      border-radius: 4px;
      font-size: 8px;
      cursor: pointer;
    }

    .preset-btn:active {
      background: rgba(0, 242, 254, 0.3);
    }

    .btn {
      width: 100%;
      padding: 7px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      font-size: 10px;
    }

    .btn-save {
      background: #00f2fe;
      color: #0d1117;
    }

    .btn-export {
      background: #00ff87;
      color: #0d1117;
      width: auto;
      padding: 4px 8px;
      font-size: 9px;
      font-weight: bold;
      border-radius: 4px;
    }

    .filter-container {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .filter-item {
      flex: 1;
    }

    .filter-item label {
      font-size: 8px;
      color: #b0bac5;
      display: block;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    /* COMPACT SCROLLABLE TABLE */
    .table-wrapper {
      width: 100%;
      max-height: 260px;
      overflow-x: auto;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 9px;
      white-space: nowrap;
      min-width: 500px;
    }

    th, td {
      padding: 4px 6px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    th {
      position: sticky;
      top: 0;
      background: #0a0f1d;
      color: #00f2fe;
      font-weight: 600;
      font-size: 8px;
      text-transform: uppercase;
      z-index: 2;
    }

    tr:hover {
      background: rgba(0, 242, 254, 0.08);
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="glass-card">
      <div>
        <h1>RGSERVE DTR System</h1>
        <small style="color: #b0bac5; font-size: 8px;">Daily Time Record & Automated Payroll</small>
      </div>
      <div class="clock-display" id="liveClock">00:00:00 AM</div>
    </header>

    <!-- DASHBOARD -->
    <div class="dashboard-grid">
      <div class="card">
        <h3>Total Logs</h3>
        <div class="value" id="totalLogs">0</div>
      </div>
      <div class="card">
        <h3>Time In</h3>
        <div class="value" id="timeInCount" style="color: #00ff87;">0</div>
      </div>
      <div class="card">
        <h3>Time Out</h3>
        <div class="value" id="timeOutCount" style="color: #ff5f56;">0</div>
      </div>
    </div>

    <!-- MAIN FORM & TABLE -->
    <div class="main-content">
      
      <!-- FORM SECTION -->
      <div class="glass-card">
        <h2 style="font-size: 11px; color: #00f2fe; margin-bottom: 4px;">Log Entry</h2>
        <form id="dtrForm">
          <label class="label-text">Employee Name</label>
          <input type="text" id="employeeName" placeholder="Enter Full Name" required>

          <label class="label-text">Work Shift</label>
          <select id="workShift" required>
            <option value="AM">AM Shift (Day)</option>
            <option value="PM">PM Shift (Night)</option>
          </select>

          <label class="label-text">Day Type / Premium</label>
          <select id="dayType" required>
            <option value="REGULAR">Regular Work Day (100%)</option>
            <option value="REST_DAY">Rest Day Duty (130%)</option>
            <option value="SPECIAL_HOLIDAY">Special Holiday (130%)</option>
            <option value="REGULAR_HOLIDAY">Regular Holiday (200%)</option>
            <option value="REST_SPECIAL">Special Holiday Rest Day (150%)</option>
            <option value="REST_REGULAR">Regular Holiday Rest Day (260%)</option>
          </select>

          <label class="label-text">Log Type</label>
          <select id="logType" required>
            <option value="IN">TIME IN</option>
            <option value="OUT">TIME OUT</option>
          </select>

          <label class="label-text">Date & Time</label>
          <input type="datetime-local" id="logTimestamp" required>

          <div class="shift-presets">
            <button type="button" class="preset-btn" onclick="setPresetTime('now')">Current</button>
            <button type="button" class="preset-btn" onclick="setPresetTime('am')">06:00 AM</button>
            <button type="button" class="preset-btn" onclick="setPresetTime('pm')">06:00 PM</button>
          </div>

          <button type="submit" class="btn btn-save">Save Log</button>
        </form>
      </div>

      <!-- TABLE SECTION -->
      <div class="glass-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <h2 style="font-size: 11px; color: #00f2fe;">Logs & Payroll Summary</h2>
          <button class="btn btn-export" onclick="exportDTR()">Export CSV</button>
        </div>

        <div style="font-size: 9px; color: #00f2fe; margin-bottom: 6px; font-weight: bold;" id="payrollOverview">
          Est. Work: 0 hrs | Pay: ₱0.00
        </div>

        <div class="filter-container">
          <div class="filter-item">
            <label>Month & Year</label>
            <input type="month" id="filterMonth" onchange="renderTable()">
          </div>
          <div class="filter-item">
            <label>Cut-off Period</label>
            <select id="filterCutoff" onchange="renderTable()">
              <option value="ALL">Whole Month</option>
              <option value="1-15">1st Cut-off (1-15)</option>
              <option value="16-31">2nd Cut-off (16-31)</option>
            </select>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Shift</th>
                <th>Type</th>
                <th>Date</th>
                <th>In</th>
                <th>Out</th>
                <th>Work</th>
                <th>Pay</th>
              </tr>
            </thead>
            <tbody id="dtrTableBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
